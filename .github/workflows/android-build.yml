name: RoutineFit Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'media/**'
      - '.github/workflows/android-build.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.webmanifest'
  pull_request:
    paths:
      - 'android/**'
      - 'media/**'
      - '.github/workflows/android-build.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.webmanifest'
  workflow_dispatch:
    inputs:
      build_signed:
        description: 'Build a signed release APK using configured GitHub Actions secrets'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test-build:
    name: Build installable debug and unsigned release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 35
        run: $(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit) 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate inline JavaScript before APK build
        run: |
          python3 -c 'import pathlib,re; h=pathlib.Path("index.html").read_text(encoding="utf-8"); s=re.findall(r"<script[^>]*>(.*?)</script>",h,re.S|re.I); assert len(s)>=2, "Missing embedded RoutineFit JS"; [pathlib.Path(f"/tmp/routinefit-inline-{i}.js").write_text(c,encoding="utf-8") for i,c in enumerate(s)]'
          for file in /tmp/routinefit-inline-*.js; do node --check "$file"; done
      - name: Build debug and unsigned release APK
        run: gradle -p android --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: routinefit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: routinefit-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  signed-release:
    name: Build signed release APK (manual, protected secrets)
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 35
        run: $(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit) 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key from GitHub Actions secrets
        env:
          KEYSTORE_B64: ${{ secrets.ROUTINEFIT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ROUTINEFIT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ROUTINEFIT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROUTINEFIT_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo 'Signing secrets missing. See android/README.md.' >&2
            exit 1
          fi
          keyfile="$(mktemp --suffix=.jks)"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          echo "ROUTINEFIT_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ROUTINEFIT_KEYSTORE_PASSWORD: ${{ secrets.ROUTINEFIT_KEYSTORE_PASSWORD }}
          ROUTINEFIT_KEY_PASSWORD: ${{ secrets.ROUTINEFIT_KEY_PASSWORD }}
          ROUTINEFIT_KEY_ALIAS: ${{ secrets.ROUTINEFIT_KEY_ALIAS }}
        run: gradle -p android --no-daemon :app:assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: routinefit-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        run: |
          if [ -n "${ROUTINEFIT_KEYSTORE_PATH:-}" ]; then rm -f "$ROUTINEFIT_KEYSTORE_PATH"; fi
