 const i=Number(active.currentExerciseIndex);
 if(Number.isInteger(i)&&i>=0&&i<active.entries.length)return i;
 const first=active.entries.findIndex((e,j)=>e.sets.length<(active.routineSnapshot[j]?.targetSets||3));
 return first<0?active.entries.length-1:first;
}
function chooseWorkoutExercise(index){

 const base=freshState(),clean={...base};

 case'select-day':selectedDay=Number(b.dataset.day);render();break;

 case'open-catalog':catalogOpen=true;settingsOpen=false;catalogSearch='';catalogFilter='전체';catalogEquip='전체';catalogScreen='list';catalogSelected=null;render();break;
 case'close-catalog':catalogOpen=false;catalogScreen='list';render();break;
 case'catalog-filter':catalogFilter=b.dataset.filter;render();break;
 case'catalog-equip':catalogEquip=b.dataset.filter;render();break;
 case'exercise-detail':catalogSelected=id;catalogScreen='detail';render();break;
 case'new-exercise':catalogSelected=null;catalogScreen='edit';render();break;
 case'edit-exercise':catalogSelected=id;catalogScreen='edit';render();break;
 case'catalog-back':catalogScreen=catalogScreen==='edit'&&catalogSelected?'detail':'list';render();break;
 case'save-exercise':saveExercise();break;
 case'delete-exercise':deleteExercise(id);break;
 case'youtube-search':searchYoutube(id,b.dataset.q);break;
 case'youtube-creator-search':{const e=byId(id); if(e)window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('황철순 '+e.name+' 운동 자세'),'_blank','noopener,noreferrer');break;}
 case'open-video':{const url=safeYT(byId(id)?.videoUrl);if(url)window.open(url,'_blank','noopener,noreferrer');break}
 case'add-routine':{let e=byId(id);if(!e)return;const list=routinesFor(selectedDay);if(list.some(x=>x.exerciseId===id)){notify('이 요일에 이미 등록된 종목입니다.');break}list.push(newRoutine(id,e.type==='time'?1:3,e.type==='time'?0:90));save();catalogOpen=false;render();notify(`${e.name}을(를) ${DAYS[selectedDay]}요일에 추가했습니다.`);break}
 case'set-count':{let r=routinesFor(selectedDay)[i];if(!r)return;r.targetSets=Math.max(1,Math.min(20,r.targetSets+Number(b.dataset.dir)));save();render();break}
 case'remove-routine':{let r=routinesFor(selectedDay);if(!r[i]||!confirm(`${byId(r[i].exerciseId)?.name}을(를) 루틴에서 삭제할까요?`))break;r.splice(i,1);save();render();break}
 case'reorder':{let r=routinesFor(selectedDay),j=i+Number(b.dataset.dir);if(j>=0&&j<r.length){[r[i],r[j]]=[r[j],r[i]];save();render()}break}
 case'start-workout':startWorkout();break;
 case'add-set':addSet(id);break;
 case'undo-set':{let en=state.active?.entries.find(e=>e.exerciseId===id),idx=Number(b.dataset.set);if(!en||!en.sets[idx]||!confirm('이 세트 기록을 삭제할까요?'))break;en.sets.splice(idx,1);save();render();notify('세트를 삭제했습니다.');break}
 case'finish-workout':finishWorkout();break;
  case'cancel-workout':cancelWorkout();break;
  case'select-active-ex':chooseWorkoutExercise(i);break;
  case'active-target':adjustActiveTarget(i,Number(b.dataset.dir));break;
 case'test-countdown-sound':unlockWorkoutAudio();playWorkoutBeep(750,.15,.14);notify('휴식 5초 카운트다운 알림음입니다.');break;
 case'timer-pause':{let t=state.timer;if(!t)break;if(t.running){t.remaining=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.running=false}else{unlockWorkoutAudio();t.endAt=Date.now()+t.remaining*1000;t.running=true}resetCountdownTracking();save();render();break}
 case'timer-adjust':{let t=state.timer;if(!t)break;let delta=Number(b.dataset.sec);if(t.running){let left=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.endAt=Date.now()+Math.max(0,left+delta)*1000}else t.remaining=Math.max(0,t.remaining+delta);resetCountdownTracking();save();render();break}
 case'timer-skip':state.timer=null;resetCountdownTracking();save();render();break;
 case'view-report':selectedReportId=b.dataset.id;render();window.scrollTo(0,0);break;
 case'delete-report':if(!confirm('이 날짜의 운동 기록 전체를 삭제할까요?'))break;state.sessions=state.sessions.filter(x=>x.id!==b.dataset.id);selectedReportId=null;save();render();notify('선택한 운동 기록을 삭제했습니다.');break;
 case'back-reports':selectedReportId=null;render();break;
  case'choose-food':{selectedFood=b.dataset.food;const f=FOOD_LIBRARY.find(x=>x.id===selectedFood);if(f){const label=el('food-choice-label'),kc=el('food-kcal'),gr=el('food-grams');if(label)label.textContent=f.name+' · 약 '+f.kcal100+'kcal/100g';if(kc)kc.value=Math.round((Number(gr?.value)||100)*f.kcal100/100)}document.querySelectorAll('.food-choice').forEach(x=>x.classList.toggle('chosen',x.dataset.food===selectedFood));break}
  case'add-food':addFood(false);break;
  case'add-custom-food':addFood(true);break;
  case'remove-food':if(confirm('이 음식 기록을 삭제할까요?')){state.foods=state.foods.filter(x=>x.id!==b.dataset.foodId);save();render()}break;
  case'add-weight':{let date=el('weight-date')?.value,w=Number(el('weight-value')?.value),fatRaw=el('fat-value')?.value,muscleRaw=el('muscle-value')?.value,fat=fatRaw===''?null:Number(fatRaw),muscle=muscleRaw===''?null:Number(muscleRaw);if(!date||date>localISO()||!Number.isFinite(w)||w<1||w>500||!el('weight-value')?.value)return notify('날짜와 올바른 체중을 입력해 주세요.');if((fat!==null&&(!isNum(fat)||fat<0||fat>100))||(muscle!==null&&(!isNum(muscle)||muscle<0||muscle>200)))return notify('체지방률 또는 골격근량을 확인해 주세요.');state.weights=state.weights.filter(x=>x.date!==date);state.weights.push({date,weight:w,fat,muscle});save();render();notify(`${date} 체중 ${fmt(w,1)}kg 저장 완료!`);break}
 case'remove-weight':{if(!confirm('이 날짜의 체중 기록을 삭제할까요?'))break;state.weights=state.weights.filter(x=>x.date!==b.dataset.date);save();render();break}
 case'save-goal':{const n=el('goal-input')?.value;if(n!==''&&(!Number.isFinite(Number(n))||Number(n)<1||Number(n)>500)){notify('목표 체중을 1~500kg 사이로 입력하세요.');break}state.settings.goalWeight=n===''?'':Number(n);save();settingsOpen=false;render();notify('체중 목표를 저장했습니다.');break}
 case'export':backupDownload();break;
 case'import':el('import-file')?.click();break;
 case'add-demo':seedDemo();settingsOpen=false;tab='home';render();break;
 case'clear-data':if(confirm('모든 운동·체중·음식 기록과 루틴을 초기화합니다. 되돌릴 수 없습니다. 사전에 백업하셨나요? 정말 초기화할까요?')){state=freshState();drafts={};save();settingsOpen=false;tab='home';render();notify('모든 데이터를 초기화했습니다.')}break;
 }
}
function handleChange(ev){const t=ev.target,f=t.dataset.field;if(f==='routine-rest'){const item=routinesFor(selectedDay)[Number(t.dataset.i)];if(!item)return;const n=Number(t.value);item.restSec=Number.isInteger(n)?Math.max(0,Math.min(3600,n)):90;save();render()}if(f==='active-rest'){const item=state.active?.routineSnapshot.find(x=>x.exerciseId===t.dataset.ex);if(!item)return;let n=Number(t.value);item.restSec=Number.isInteger(n)?Math.max(0,Math.min(3600,n)):90;save();render()}if(t.id==='workout-duration'&&state.active){state.active.durationMin=Math.max(1,Math.min(1440,Number(t.value)||1));save()}if(t.id==='workout-met'&&state.active){state.active.met=Number(t.value);save()}if(f==='food-day'){foodDate=t.value||localISO();foodSearch='';render()}if(f==='sound'||f==='vibration'||f==='countdown'||f==='keepAwake'){state.settings[f]=t.checked;if(f==='sound'&&t.checked)unlockWorkoutAudio();if(f==='keepAwake')syncScreenWakeLock();save();if(f==='keepAwake')render()}if(t.id==='import-file')importBackup(t.files?.[0])}
function handleInput(ev){const t=ev.target,f=t.dataset.field;if(f&&f.startsWith('draft-')){const d=ensureDraft(t.dataset.ex);d[f.slice(6)]=t.value;}if(t.id==='food-search'){foodSearch=t.value;const list=el('food-search-list');if(list)list.innerHTML=foodItems()}if(t.id==='food-grams'){const f=FOOD_LIBRARY.find(x=>x.id===selectedFood);const kcal=el('food-kcal');if(f&&kcal&&t.value)kcal.value=Math.round(Number(t.value)*f.kcal100/100)}if(t.id==='catalog-search'){catalogSearch=t.value;const matched=allExercises().filter(x=>(catalogFilter==='전체'||x.muscle===catalogFilter)&&(catalogEquip==='전체'||x.equipment===catalogEquip)&&(`${x.name} ${(x.aliases||[]).join(' ')} ${x.hwangReference?'황철순':''} ${x.muscle} ${EQUIP_LABEL[x.equipment]||''} ${x.description||''}`).toLocaleLowerCase().includes(catalogSearch.toLocaleLowerCase()));const list=el('catalog-list');if(list)list.innerHTML=renderCatalogItems(matched)}}
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);
if('serviceWorker'in navigator&&location.protocol==='https:'||('serviceWorker'in navigator&&location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 hydratePersistentData();
 window.RoutineFitDebug={getState:()=>state,estimate1RM,sessionMetrics,setTab,localISO,EXERCISES,allExercises,byId,workoutKcal,foodTotal,hydratePersistentData,updateTimerVisual,screenShouldStayOn,wakeStatusText,unlockWorkoutAudio};
})();
