function sessionMetrics(s){let sets=0,reps=0,tonnage=0,minutes=0,estimated1RM=null;for(const e of s.entries){const ex=byId(e.exerciseId);if(!ex)continue;sets+=e.sets.length;if(ex.type==='time')minutes+=e.sets.reduce((a,x)=>a+(x.seconds||0),0)/60;else reps+=e.sets.reduce((a,x)=>a+(x.reps||0),0);tonnage+=totalWorkout(e);if(ex.type==='weight'&&!isAssist(ex.id)){for(const st of e.sets){const r=estimate1RM(st.weight,st.reps);if(r!=null)estimated1RM=Math.max(estimated1RM??0,r)}}}return{sets,reps,tonnage,minutes,estimated1RM,exercises:s.entries.filter(e=>e.sets.length).length}}

function difference(ex,cur,prev){if(!prev)return{str:'첫 기록',kind:'muted'};if(ex.type==='time'){const delta=(cur.seconds||0)-(prev.seconds||0);return{str:delta===0?'동일':`${delta>0?'+':''}${delta}초`,kind:delta>0?'positive':delta<0?'negative':'muted'}}if(ex.type==='body'){const delta=(cur.reps||0)-(prev.reps||0);return{str:delta===0?'동일':`${delta>0?'+':''}${delta}회`,kind:delta>0?'positive':delta<0?'negative':'muted'}}const w=(cur.weight||0)-(prev.weight||0),r=(cur.reps||0)-(prev.reps||0);if(w===0&&r===0)return{str:'동일',kind:'muted'};let parts=[];if(w!==0)parts.push(`${w>0?'+':''}${fmt(w,1)}kg`);if(r!==0)parts.push(`${r>0?'+':''}${r}회`);const ton=(cur.weight||0)*(cur.reps||0)-(prev.weight||0)*(prev.reps||0);return{str:parts.join(' · '),kind:ton>0?'positive':ton<0?'negative':'muted'}}
const best1RM=(entry)=>{const ex=byId(entry.exerciseId);if(!ex||ex.type!=='weight'||isAssist(ex.id))return null;return entry.sets.reduce((best,s)=>Math.max(best,estimate1RM(s.weight,s.reps)||0),0)||null};

async function promptInstall(){

 const event=installPromptEvent;

 try{await event.prompt();await event.userChoice;}

}

function settings(){if(!settingsOpen)return'';return `<div class="modal-backdrop" data-action="close-settings"><section class="modal-sheet setting-sheet" role="dialog" aria-modal="true" aria-label="설정" data-stop-close="1"><div class="sheet-grabber"></div><div class="sheet-header"><div><span class="overline">PREFERENCES</span><h2>앱 설정 및 데이터</h2></div><button class="round-button" data-action="close-settings" aria-label="닫기">${I('close',20)}</button></div><div class="setting-content">${pwaInstalled?'':`<div class="setting-group"><h3>휴대폰 홈 화면 아이콘</h3><p class="setting-note">설치 후 루틴핏 아이콘을 누르면 앱이 직접 열립니다. 브라우저 메뉴에서 홈 화면에 추가할 수도 있습니다.</p><button class="secondary-btn full" data-action="install-pwa">${I('plus',17)} 홈 화면에 앱 설치</button></div>`}<div class="setting-group"><h3>운동 라이브러리</h3><p class="setting-note">다양한 별칭(덤벨 스퀴즈·헥스 프레스·스미스 등)으로 종목을 검색하고, 운동별 유튜브 자세 영상과 황철순 관련 영상을 검색할 수 있습니다. 검색 결과는 검증된 추천 영상이 아닙니다.</p><button class="secondary-btn full" data-action="open-catalog">${I('search',16)} 종목 검색 · 추가 · 수정</button></div><div class="setting-group"><h3>체중 목표</h3><label class="setting-input">목표 체중 (kg)<input type="number" id="goal-input" value="${esc(state.settings.goalWeight)}" placeholder="예 72" min="1" max="500" step="0.1" inputmode="decimal"/></label><button class="secondary-btn" data-action="save-goal">목표 저장</button></div><div class="setting-group"><h3>타이머 알림</h3><label class="toggle-row"><span>휴식 종료 시 소리</span><input type="checkbox" data-field="sound" ${state.settings.sound?'checked':''}/></label><label class="toggle-row"><span>휴식 종료 시 진동</span><input type="checkbox" data-field="vibration" ${state.settings.vibration?'checked':''}/></label><p class="setting-note">기기와 브라우저에 따라 소리·진동이 제한될 수 있습니다. 백그라운드 알림은 보장하지 않습니다.</p></div><div class="setting-group"><h3>내 기록 백업</h3><p class="setting-note">모든 데이터는 이 기기의 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하거나 기기를 바꾸면 기록이 사라질 수 있으니 정기적으로 백업하세요.</p><div class="setting-actions"><button class="secondary-btn" data-action="export">${I('download',17)} 백업 저장</button><button class="secondary-btn" data-action="import">${I('upload',17)} 백업 불러오기</button></div><input id="import-file" type="file" accept="application/json,.json" hidden/></div><div class="setting-group"><h3>앱 체험</h3><p class="setting-note">테스트용 가상 체중과 운동 기록을 추가해 비교 기능을 확인할 수 있습니다.</p><button class="secondary-btn" data-action="add-demo">${I('plus',17)} 예시 기록 추가</button></div><div class="setting-group danger-zone"><h3>기록 관리</h3><button class="danger-btn" data-action="clear-data">${I('trash',16)} 모든 운동·체중 데이터 초기화</button></div><div class="version-footer">ROUTINE FIT v${VERSION} · 로컬 저장 · 오프라인 지원</div></div></section></div>`}
function timer(){const t=state.timer;if(!t||tab!=='workout')return'';let left=t.running?Math.max(0,Math.ceil((t.endAt-Date.now())/1000)):t.remaining;return `<div class="timer-floating" role="timer" aria-label="휴식 타이머"><div class="timer-small">${I('timer',19)}<div><span>세트 사이 휴식</span><strong>${esc(byId(t.exerciseId)?.name||'운동')}</strong></div></div><div class="timer-digits" id="timer-digits">${timeFmt(left)}</div><div class="timer-actions"><button data-action="timer-adjust" data-sec="-15">−15초</button><button class="timer-pause" data-action="timer-pause">${I(t.running?'pause':'play',16)}</button><button data-action="timer-adjust" data-sec="15">+15초</button><button class="timer-skip" data-action="timer-skip">${I('skip',16)}</button></div></div>`}
function render(){if(state.timer?.running&&Date.now()>=state.timer.endAt)expireTimer(false);const views={home,routine,workout,history,weight};el('app').innerHTML=`<div class="app-shell">${top()}<main id="main-content">${tab==='home'?installCard():''}${(views[tab]||home)()}</main>${nav()}</div>${catalog()}${settings()}${timer()}<div class="toast" id="toast" role="status"></div>`;if(toastMessage){const t=el('toast');t.textContent=toastMessage;}document.title=`루틴핏 | ${({home:'홈',routine:'루틴',workout:'운동',history:'운동 기록',weight:'체중'}[tab])||'홈'}`;updateTimerVisual()}
function setTab(next){tab=next;if(next==='history')selectedReportId=null;catalogOpen=false;settingsOpen=false;window.scrollTo(0,0);render()}
function startWorkout(){let r=routinesFor(startDay);if(!r.length){notify('운동 종목을 먼저 추가해 주세요.');return}state.active={id:makeId(),day:startDay,startedAt:new Date().toISOString(),routineSnapshot:JSON.parse(JSON.stringify(r)),entries:r.map(x=>({exerciseId:x.exerciseId,sets:[]}))};drafts={};save();render();notify('운동을 시작했습니다!')}
function addSet(id){let active=state.active,ex=byId(id),entry=active?.entries.find(x=>x.exerciseId===id),d=drafts[id];if(!active||!ex||!entry||!d)return;let set={id:makeId(),createdAt:new Date().toISOString()};if(ex.type==='time'){const s=Number(d.seconds);if(!Number.isInteger(s)||s<1||s>86400)return notify('운동 시간을 1~86,400초 사이로 입력하세요.');set.seconds=s}else{let r=Number(d.reps);if(!Number.isInteger(r)||r<1||r>10000)return notify('반복 횟수를 1~10,000회 사이로 입력하세요.');set.reps=r;if(ex.type==='weight'){let w=Number(d.weight);if(!Number.isFinite(w)||w<0||w>10000)return notify('무게는 0~10,000kg 사이로 입력하세요.');set.weight=w}}
 const before=lastEntry(id)?.entry.sets[entry.sets.length];entry.sets.push(set);save();const comp=difference(ex,set,before);let rest=active.routineSnapshot.find(x=>x.exerciseId===id)?.restSec||0;state.timer=null;if(rest>0){state.timer={exerciseId:id,running:true,remaining:rest,endAt:Date.now()+rest*1000};timerAnnounced=false}save();render();notify(`${ex.name} ${entry.sets.length}세트 저장${comp.str!=='첫 기록'?` · 이전 대비 ${comp.str}`:''}`)}
function finishWorkout(){const active=state.active;if(!active)return;const count=active.entries.reduce((a,e)=>a+e.sets.length,0);if(!count){if(!confirm('기록한 세트가 없습니다. 운동을 취소할까요?'))return;state.active=null;state.timer=null;save();setTab('home');return}if(!confirm(`총 ${count}세트를 저장하고 오늘의 운동을 완료할까요?`))return;active.endedAt=new Date().toISOString();state.sessions.unshift(active);state.sessions.sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));selectedReportId=active.id;state.active=null;state.timer=null;drafts={};save();tab='history';window.scrollTo(0,0);render();notify('오늘의 운동 리포트가 저장되었습니다!')}
function expireTimer(reRender=true){if(!state.timer)return;const t=state.timer;state.timer=null;save();if(state.settings.vibration&&navigator.vibrate)try{navigator.vibrate([180,90,180])}catch(e){}if(state.settings.sound)try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),now=ctx.currentTime;for(let n=0;n<2;n++){let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=n===0?650:820;gain.gain.setValueAtTime(0.0001,now+n*.18);gain.gain.exponentialRampToValueAtTime(.1,now+n*.18+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+n*.18+.15);osc.connect(gain).connect(ctx.destination);osc.start(now+n*.18);osc.stop(now+n*.18+.17)}setTimeout(()=>ctx.close(),1000)}catch(e){}if(reRender)render();notify(`${byId(t.exerciseId)?.name||'운동'} 휴식 종료! 다음 세트를 진행하세요.`)}
function updateTimerVisual(){const t=state.timer;if(!t)return;let left=t.running?Math.max(0,Math.ceil((t.endAt-Date.now())/1000)):t.remaining;let d=el('timer-digits');if(d)d.textContent=timeFmt(left);if(t.running&&left<=0)expireTimer()}
setInterval(updateTimerVisual,500);
function backupDownload(){const json=JSON.stringify({product:'RoutineFit',exportVersion:VERSION,exportedAt:new Date().toISOString(),data:state},null,2);if(window.RoutineFitNative?.saveBackup){window.RoutineFitNative.saveBackup(json);return}const blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`routinefit-backup-${localISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 저장했습니다.');}
function seedDemo(){const base=new Date();const dBefore=n=>{const d=new Date(base);d.setDate(d.getDate()-n);return d};let makeSession=(n,data)=>{let d=dBefore(n),entries=data.map(([id,sets])=>({exerciseId:id,sets:sets.map(([w,r],j)=>({id:makeId(),weight:w,reps:r,createdAt:d.toISOString()}))}));return{id:makeId(),day:(d.getDay()+6)%7,startedAt:d.toISOString(),endedAt:new Date(d.getTime()+55*60000).toISOString(),entries}};let d1=makeSession(7,[['barbell-bench',[[50,10],[55,8],[55,7]]],['lat-pulldown',[[40,12],[45,10]]]]),d2=makeSession(3,[['barbell-bench',[[55,10],[60,8],[60,7]]],['lat-pulldown',[[45,12],[50,10]]]]);state.sessions=[...state.sessions,d2,d1].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));for(const [n,w] of [[12,78.5],[9,78.1],[7,77.8],[5,77.6],[3,77.3],[1,77.1]]){let date=localISO(dBefore(n));if(!state.weights.some(x=>x.date===date))state.weights.push({date,weight:w,fat:null,muscle:null})}save();notify('가상 운동·체중 예시 기록을 추가했습니다.');}
function cleanBackup(v){
 const base=freshState(),clean={...base};
 const clamp=(n,min,max,def)=>{n=Number(n);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):def};
 const safeId=id=>typeof id==='string'&&/^[a-zA-Z0-9_-]{1,90}$/.test(id)?id:makeId();
 const safeDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00'))?s:null;
 const safeIso=s=>typeof s==='string'&&!Number.isNaN(Date.parse(s))?new Date(s).toISOString():null;
 const safeFreeText=(x,max)=>String(x??'').slice(0,max).trim();
 clean.customExercises=(Array.isArray(v.customExercises)?v.customExercises:[]).slice(0,1200).map(e=>{if(!e||typeof e!=='object'||typeof e.id!=='string'||!/^user-[a-zA-Z0-9_-]{2,80}$/.test(e.id)||!EQUIP_LABEL[e.equipment]||!['weight','body','time'].includes(e.type)||!['가슴','등','하체','어깨','팔','복근','전신','유산소'].includes(e.muscle)||!safeFreeText(e.name,65))return null;return{id:e.id,name:safeFreeText(e.name,65),muscle:e.muscle,equipment:e.equipment,type:e.type,description:safeFreeText(e.description,600),tip:safeFreeText(e.tip,600),videoUrl:safeYT(e.videoUrl||''),imageUrl:safeImg(e.imageUrl||'')}}).filter(Boolean);
 clean.exerciseOverrides={};for(const [id,over] of Object.entries(v.exerciseOverrides||{}).slice(0,500)){if(!EXERCISES.some(e=>e.id===id)||!over||typeof over!=='object')continue;clean.exerciseOverrides[id]={name:safeFreeText(over.name,65)||EXERCISES.find(e=>e.id===id).name,description:safeFreeText(over.description,600),tip:safeFreeText(over.tip,600),videoUrl:safeYT(over.videoUrl||'')}};
 const importedById=id=>{const base=EXERCISES.find(e=>e.id===id);return base?{...base,...(clean.exerciseOverrides[id]||{})}:clean.customExercises.find(e=>e.id===id)||null};
 const cleanEntries=entries=>Array.isArray(entries)?entries.slice(0,100).map(e=>{
   const ex=importedById(e?.exerciseId);if(!ex)return null;
   const sets=Array.isArray(e.sets)?e.sets.slice(0,100).map(st=>{
     if(ex.type==='time'){const sec=Number(st?.seconds);return Number.isInteger(sec)&&sec>=1&&sec<=86400?{id:safeId(st?.id),seconds:sec,createdAt:safeIso(st?.createdAt)||new Date().toISOString()}:null}
     const reps=Number(st?.reps);if(!Number.isInteger(reps)||reps<1||reps>10000)return null;
     const set={id:safeId(st?.id),reps,createdAt:safeIso(st?.createdAt)||new Date().toISOString()};
     if(ex.type==='weight'){const weight=Number(st?.weight);if(!Number.isFinite(weight)||weight<0||weight>10000)return null;set.weight=weight}return set;
   }).filter(Boolean):[];
   return{exerciseId:ex.id,sets};
 }).filter(Boolean):[];
 for(let day=0;day<7;day++){
   let seen=new Set();const rr=Array.isArray(v.routines?.[day])?v.routines[day]:base.routines[day];
   clean.routines[day]=rr.slice(0,100).filter(r=>{if(!importedById(r?.exerciseId)||seen.has(r.exerciseId))return false;seen.add(r.exerciseId);return true}).map(r=>({exerciseId:r.exerciseId,targetSets:Math.round(clamp(r.targetSets,1,20,3)),restSec:Math.round(clamp(r.restSec,0,3600,90))}));
 }
 clean.sessions=v.sessions.slice(0,3000).map(x=>{const startedAt=safeIso(x?.startedAt);if(!startedAt)return null;return{id:safeId(x.id),day:Math.round(clamp(x.day,0,6,0)),startedAt,endedAt:safeIso(x.endedAt)||startedAt,entries:cleanEntries(x.entries)}}).filter(Boolean).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));
 clean.weights=v.weights.slice(0,5000).map(w=>{const date=safeDate(w?.date),weight=Number(w?.weight);if(!date||!Number.isFinite(weight)||weight<1||weight>500)return null;const optional=(value,max)=>value==null?null:(Number.isFinite(Number(value))&&Number(value)>=0&&Number(value)<=max?Number(value):null);return {date,weight,fat:optional(w.fat,100),muscle:optional(w.muscle,200)}}).filter(Boolean);
 const settings=v.settings||{};clean.settings={goalWeight:settings.goalWeight===''?'':clamp(settings.goalWeight,1,500,''),sound:settings.sound!==false,vibration:settings.vibration!==false};
 if(v.active&&safeIso(v.active.startedAt))clean.active={id:safeId(v.active.id),day:Math.round(clamp(v.active.day,0,6,0)),startedAt:safeIso(v.active.startedAt),routineSnapshot:(Array.isArray(v.active.routineSnapshot)?v.active.routineSnapshot:[]).filter(r=>importedById(r.exerciseId)).map(r=>({exerciseId:r.exerciseId,targetSets:Math.round(clamp(r.targetSets,1,20,3)),restSec:Math.round(clamp(r.restSec,0,3600,90))})),entries:cleanEntries(v.active.entries)};
 clean.timer=null;
 return clean;
}
function importBackup(file){if(!file)return;if(file.size>10000000){notify('10MB 이하의 백업 파일을 선택해 주세요.');return}file.text().then(txt=>{const raw=JSON.parse(txt);const v=raw.data||raw;if(!v||!Array.isArray(v.sessions)||!Array.isArray(v.weights)||!v.routines||typeof v.routines!=='object')throw Error('형식이 맞지 않습니다.');const imported=cleanBackup(v);if(!confirm('현재 데이터를 백업 파일의 내용으로 교체할까요?'))return;state=imported;drafts={};save();settingsOpen=false;tab='home';render();notify('백업을 불러왔습니다.');}).catch(err=>{console.error(err);notify('올바른 루틴핏 백업 파일인지 확인해 주세요.')})}

function handleClick(ev){const b=ev.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='close-catalog'||b.dataset.action==='close-settings'){if(ev.target.closest('[data-stop-close]')&&!ev.target.closest('button'))return}const act=b.dataset.action,id=b.dataset.ex,i=Number(b.dataset.i);switch(act){

 case'youtube-search':searchYoutube(id,b.dataset.q);break;
 case'youtube-creator-search':{const e=byId(id); if(e)window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('황철순 '+e.name+' 운동 자세'),'_blank','noopener,noreferrer');break;}
 case'open-video':{const url=safeYT(byId(id)?.videoUrl);if(url)window.open(url,'_blank','noopener,noreferrer');break}
 case'add-routine':{let e=byId(id);if(!e)return;const list=routinesFor(selectedDay);if(list.some(x=>x.exerciseId===id)){notify('이 요일에 이미 등록된 종목입니다.');break}list.push(newRoutine(id,e.type==='time'?1:3,e.type==='time'?0:90));save();catalogOpen=false;render();notify(`${e.name}을(를) ${DAYS[selectedDay]}요일에 추가했습니다.`);break}
 case'set-count':{let r=routinesFor(selectedDay)[i];if(!r)return;r.targetSets=Math.max(1,Math.min(20,r.targetSets+Number(b.dataset.dir)));save();render();break}
 case'remove-routine':{let r=routinesFor(selectedDay);if(!r[i]||!confirm(`${byId(r[i].exerciseId)?.name}을(를) 루틴에서 삭제할까요?`))break;r.splice(i,1);save();render();break}
 case'reorder':{let r=routinesFor(selectedDay),j=i+Number(b.dataset.dir);if(j>=0&&j<r.length){[r[i],r[j]]=[r[j],r[i]];save();render()}break}
 case'start-workout':startWorkout();break;
 case'add-set':addSet(id);break;
 case'undo-set':{let en=state.active?.entries.find(e=>e.exerciseId===id),idx=Number(b.dataset.set);if(!en||!en.sets[idx]||!confirm('이 세트 기록을 삭제할까요?'))break;en.sets.splice(idx,1);save();render();notify('세트를 삭제했습니다.');break}
 case'finish-workout':finishWorkout();break;
 case'timer-pause':{let t=state.timer;if(!t)break;if(t.running){t.remaining=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.running=false}else{t.endAt=Date.now()+t.remaining*1000;t.running=true}save();render();break}
 case'timer-adjust':{let t=state.timer;if(!t)break;let delta=Number(b.dataset.sec);if(t.running){let left=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.endAt=Date.now()+Math.max(0,left+delta)*1000}else t.remaining=Math.max(0,t.remaining+delta);save();render();break}
 case'timer-skip':state.timer=null;save();render();break;
 case'view-report':selectedReportId=b.dataset.id;render();window.scrollTo(0,0);break;
 case'delete-report':if(!confirm('이 날짜의 운동 기록 전체를 삭제할까요?'))break;state.sessions=state.sessions.filter(x=>x.id!==b.dataset.id);selectedReportId=null;save();render();notify('선택한 운동 기록을 삭제했습니다.');break;
 case'back-reports':selectedReportId=null;render();break;
 case'add-weight':{let date=el('weight-date')?.value,w=Number(el('weight-value')?.value),fatRaw=el('fat-value')?.value,muscleRaw=el('muscle-value')?.value,fat=fatRaw===''?null:Number(fatRaw),muscle=muscleRaw===''?null:Number(muscleRaw);if(!date||date>localISO()||!Number.isFinite(w)||w<1||w>500||!el('weight-value')?.value)return notify('날짜와 올바른 체중을 입력해 주세요.');if((fat!==null&&(!isNum(fat)||fat<0||fat>100))||(muscle!==null&&(!isNum(muscle)||muscle<0||muscle>200)))return notify('체지방률 또는 골격근량을 확인해 주세요.');state.weights=state.weights.filter(x=>x.date!==date);state.weights.push({date,weight:w,fat,muscle});save();render();notify(`${date} 체중 ${fmt(w,1)}kg 저장 완료!`);break}
 case'remove-weight':{if(!confirm('이 날짜의 체중 기록을 삭제할까요?'))break;state.weights=state.weights.filter(x=>x.date!==b.dataset.date);save();render();break}
 case'save-goal':{const n=el('goal-input')?.value;if(n!==''&&(!Number.isFinite(Number(n))||Number(n)<1||Number(n)>500)){notify('목표 체중을 1~500kg 사이로 입력하세요.');break}state.settings.goalWeight=n===''?'':Number(n);save();settingsOpen=false;render();notify('체중 목표를 저장했습니다.');break}
 case'export':backupDownload();break;
 case'import':el('import-file')?.click();break;
 case'add-demo':seedDemo();settingsOpen=false;tab='home';render();break;
 case'clear-data':if(confirm('모든 운동 및 체중 기록과 루틴을 초기화합니다. 되돌릴 수 없습니다. 정말 초기화할까요?')){state=freshState();drafts={};save();settingsOpen=false;tab='home';render();notify('모든 데이터를 초기화했습니다.')}break;
 }
}
function handleChange(ev){const t=ev.target,f=t.dataset.field;if(f==='routine-rest'){const item=routinesFor(selectedDay)[Number(t.dataset.i)];if(!item)return;const n=Number(t.value);item.restSec=Number.isInteger(n)?Math.max(0,Math.min(3600,n)):90;save();render()}if(f==='active-rest'){const item=state.active?.routineSnapshot.find(x=>x.exerciseId===t.dataset.ex);if(!item)return;let n=Number(t.value);item.restSec=Number.isInteger(n)?Math.max(0,Math.min(3600,n)):90;save();render()}if(f==='sound'||f==='vibration'){state.settings[f]=t.checked;save()}if(t.id==='import-file')importBackup(t.files?.[0])}
function handleInput(ev){const t=ev.target,f=t.dataset.field;if(f&&f.startsWith('draft-')){const d=ensureDraft(t.dataset.ex);d[f.slice(6)]=t.value;}if(t.id==='catalog-search'){catalogSearch=t.value;const matched=allExercises().filter(x=>(catalogFilter==='전체'||x.muscle===catalogFilter)&&(catalogEquip==='전체'||x.equipment===catalogEquip)&&(`${x.name} ${(x.aliases||[]).join(' ')} ${x.hwangReference?'황철순':''} ${x.muscle} ${EQUIP_LABEL[x.equipment]||''} ${x.description||''}`).toLocaleLowerCase().includes(catalogSearch.toLocaleLowerCase()));const list=el('catalog-list');if(list)list.innerHTML=renderCatalogItems(matched)}}
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);
if('serviceWorker'in navigator&&location.protocol==='https:'||('serviceWorker'in navigator&&location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
window.RoutineFitDebug={getState:()=>state,estimate1RM,sessionMetrics,setTab,localISO,EXERCISES,allExercises,byId};
})();

</script>
